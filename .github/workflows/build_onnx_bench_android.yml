name: Build Android ONNX CPU NNAPI benchmark

on:
  push:
    paths:
      - 'tools/onnx_bench_android.cpp'
      - 'tools/bench_android.sh'
      - 'tools/select_adb_device.sh'
      - 'tools/bench_mediatek_neuron.sh'
      - 'tools/neuron_smoke_android.cpp'
      - 'tools/neuron_conv_android.cpp'
      - 'tools/bench_mediatek_conv.sh'
      - 'tools/bench_mediatek_conv_fp16.sh'
      - 'tools/neuron_conv_fp16_android.cpp'
      - 'tools/probe_mediatek_npu.sh'
      - 'tools/test_bench_android_smoke.sh'
      - '.github/workflows/build_onnx_bench_android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Regression test Vivo ADB device detection
        run: |
          bash -n tools/bench_android.sh
          bash tools/test_bench_android_smoke.sh
      - name: Install NDK and ONNX Runtime Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          mkdir -p build/ort_android
          curl -fL --retry 3 -o build/ort_android/onnxruntime.aar \
            https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.23.2/onnxruntime-android-1.23.2.aar
          unzip -l build/ort_android/onnxruntime.aar | grep -E 'headers/onnxruntime_cxx_api.h|headers/onnxruntime_c_api.h|jni/arm64-v8a/libonnxruntime.so'
          unzip -p build/ort_android/onnxruntime.aar jni/arm64-v8a/libonnxruntime.so > build/ort_android/libonnxruntime.so
          unzip -oq build/ort_android/onnxruntime.aar 'headers/*' -d build/ort_android
      - name: Compile ARM64 ONNX benchmark and check shell script
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/bench_android.sh
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$CXX" -std=c++17 -O2 -fPIE -pie -Ibuild/ort_android/headers tools/onnx_bench_android.cpp \
            -Lbuild/ort_android -lonnxruntime -lneuralnetworks -llog -ldl -Wl,-rpath,'$ORIGIN' \
            -o build/ort_android/onnx_bench_android
          file build/ort_android/onnx_bench_android
      - name: Compile native MediaTek Neuron Adapter smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/bench_mediatek_neuron.sh
          mkdir -p build/neuron_android
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_smoke_android.cpp -ldl -o build/neuron_android/neuron_smoke_android
          file build/neuron_android/neuron_smoke_android
          bash -n tools/bench_mediatek_conv.sh
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_conv_android.cpp -ldl -o build/neuron_android/neuron_conv_android
          file build/neuron_android/neuron_conv_android
          bash -n tools/bench_mediatek_conv_fp16.sh
          grep -Fq '"$ROOT/tools/neuron_conv_fp16_android.cpp"' tools/bench_mediatek_conv_fp16.sh
          grep -Fq '"$REMOTE/neuron_conv_fp16_android"' tools/bench_mediatek_conv_fp16.sh
          grep -Fq '"chmod 755 $REMOTE/neuron_conv_fp16_android"' tools/bench_mediatek_conv_fp16.sh
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_conv_fp16_android.cpp -ldl -o build/neuron_android/neuron_conv_fp16_android
          file build/neuron_android/neuron_conv_fp16_android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-onnx-bench-arm64
          path: |
            build/ort_android/onnx_bench_android
            build/neuron_android/neuron_smoke_android
            build/neuron_android/neuron_conv_android
            build/neuron_android/neuron_conv_fp16_android
          if-no-files-found: ignore
