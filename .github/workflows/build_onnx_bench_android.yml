name: Build Android ONNX CPU NNAPI benchmark

on:
  push:
    paths:
      - 'tools/onnx_bench_android.cpp'
      - 'tools/bench_android.sh'
      - 'tools/select_adb_device.sh'
      - 'tools/bench_mediatek_neuron.sh'
      - 'tools/neuron_smoke_android.cpp'
      - 'tools/neuron_conv_android.cpp'
      - 'tools/bench_mediatek_conv.sh'
      - 'tools/bench_mediatek_conv_fp16.sh'
      - 'tools/neuron_conv_fp16_android.cpp'
      - 'tools/export_katago_first_conv.py'
      - 'tools/inspect_katago_onnx.py'
      - 'tools/export_katago_residual_conv.py'
      - 'tools/bench_mediatek_katago_residual_conv.sh'
      - 'tools/bench_mediatek_residual_add.sh'
      - 'tools/neuron_residual_add_android.cpp'
      - 'tools/export_katago_rconv1_block.py'
      - 'tools/neuron_katago_rconv1_android.cpp'
      - 'tools/bench_mediatek_katago_rconv1.sh'
      - 'tools/neuron_katago_first_conv_android.cpp'
      - 'tools/bench_mediatek_katago_first_conv.sh'
      - 'tools/probe_mediatek_npu.sh'
      - 'tools/test_bench_android_smoke.sh'
      - '.github/workflows/build_onnx_bench_android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Regression test Vivo ADB device detection
        run: |
          bash -n tools/bench_android.sh
          bash tools/test_bench_android_smoke.sh
      - name: Install NDK and ONNX Runtime Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          mkdir -p build/ort_android
          curl -fL --retry 3 -o build/ort_android/onnxruntime.aar \
            https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.23.2/onnxruntime-android-1.23.2.aar
          unzip -l build/ort_android/onnxruntime.aar | grep -E 'headers/onnxruntime_cxx_api.h|headers/onnxruntime_c_api.h|jni/arm64-v8a/libonnxruntime.so'
          unzip -p build/ort_android/onnxruntime.aar jni/arm64-v8a/libonnxruntime.so > build/ort_android/libonnxruntime.so
          unzip -oq build/ort_android/onnxruntime.aar 'headers/*' -d build/ort_android
      - name: Compile ARM64 ONNX benchmark and check shell script
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/bench_android.sh
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$CXX" -std=c++17 -O2 -fPIE -pie -Ibuild/ort_android/headers tools/onnx_bench_android.cpp \
            -Lbuild/ort_android -lonnxruntime -lneuralnetworks -llog -ldl -Wl,-rpath,'$ORIGIN' \
            -o build/ort_android/onnx_bench_android
          file build/ort_android/onnx_bench_android
      - name: Compile native MediaTek Neuron Adapter smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/bench_mediatek_neuron.sh
          mkdir -p build/neuron_android
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_smoke_android.cpp -ldl -o build/neuron_android/neuron_smoke_android
          file build/neuron_android/neuron_smoke_android
          bash -n tools/bench_mediatek_conv.sh
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_conv_android.cpp -ldl -o build/neuron_android/neuron_conv_android
          file build/neuron_android/neuron_conv_android
          bash -n tools/bench_mediatek_conv_fp16.sh
          grep -Fq '"$ROOT/tools/neuron_conv_fp16_android.cpp"' tools/bench_mediatek_conv_fp16.sh
          grep -Fq '"$REMOTE/neuron_conv_fp16_android"' tools/bench_mediatek_conv_fp16.sh
          grep -Fq '"chmod 755 $REMOTE/neuron_conv_fp16_android"' tools/bench_mediatek_conv_fp16.sh
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_conv_fp16_android.cpp -ldl -o build/neuron_android/neuron_conv_fp16_android
          file build/neuron_android/neuron_conv_fp16_android
          bash -n tools/bench_mediatek_katago_first_conv.sh
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_katago_first_conv_android.cpp -ldl -o build/neuron_android/neuron_katago_first_conv_android
          file build/neuron_android/neuron_katago_first_conv_android
          bash -n tools/bench_mediatek_residual_add.sh
          grep -Fq '"$ROOT/tools/neuron_residual_add_android.cpp"' tools/bench_mediatek_residual_add.sh
          grep -Fq '"chmod 755 $REMOTE/neuron_residual_add_android"' tools/bench_mediatek_residual_add.sh
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_residual_add_android.cpp -ldl -o build/neuron_android/neuron_residual_add_android
          file build/neuron_android/neuron_residual_add_android
          bash -n tools/bench_mediatek_katago_rconv1.sh
          grep -Fq '"$ROOT/tools/export_katago_rconv1_block.py"' tools/bench_mediatek_katago_rconv1.sh
          grep -Fq '"$ROOT/tools/neuron_katago_rconv1_android.cpp"' tools/bench_mediatek_katago_rconv1.sh
          grep -Fq '"chmod 755 $REMOTE/neuron_katago_rconv1_android"' tools/bench_mediatek_katago_rconv1.sh
          "$CXX" -std=c++17 -O2 -fPIE -pie tools/neuron_katago_rconv1_android.cpp -ldl -o build/neuron_android/neuron_katago_rconv1_android
          file build/neuron_android/neuron_katago_rconv1_android
      - name: Validate KataGo ONNX first Conv exporter on real model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'numpy==1.24.4' 'onnx==1.16.2' 'onnxruntime==1.19.2'
          curl -fL --retry 3 -o build/ort_android/10b_19x19.onnx \
            https://github.com/rstg00po54/go/releases/download/katago-10b-onnx-v1/10b_19x19.onnx
          python3 tools/inspect_katago_onnx.py build/ort_android/10b_19x19.onnx --limit 95
          python3 tools/export_katago_first_conv.py \
            --model build/ort_android/10b_19x19.onnx --out build/neuron_android/katago_first_conv.bin
          python3 - <<'PY'
          import pathlib,struct
          p=pathlib.Path("build/neuron_android/katago_first_conv.bin")
          magic,*a=struct.unpack("<8s12I",p.read_bytes()[:56])
          assert magic==b"K10CV001" and a[2]>0 and a[3]>0 and a[10]>0 and a[11]>0
          print("Validated ONNX first Conv extracted packet:", a, p.stat().st_size)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Validate real KataGo Conv exporter on Python 3.8
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip install 'numpy==1.24.4' 'onnx==1.16.2' 'onnxruntime==1.16.3'
          python tools/export_katago_first_conv.py \
            --model build/ort_android/10b_19x19.onnx --out build/neuron_android/katago_first_conv_py38.bin
          python - <<'PY'
          import pathlib,struct
          p=pathlib.Path("build/neuron_android/katago_first_conv_py38.bin")
          magic,*a=struct.unpack("<8s12I",p.read_bytes()[:56])
          assert magic==b"K10CV001" and a==[19,19,22,128,5,5,2,2,2,2,19,19], a
          print("PASS Python3.8 ONNX Runtime 1.16.3: real KataGo first Conv",a)
          PY
          bash -n tools/bench_mediatek_katago_residual_conv.sh
          grep -Fq '"$ROOT/tools/export_katago_residual_conv.py"' tools/bench_mediatek_katago_residual_conv.sh
          python tools/export_katago_residual_conv.py --model build/ort_android/10b_19x19.onnx --node rconv1/w1 --out build/neuron_android/rconv1_w1.bin
          python tools/export_katago_residual_conv.py --model build/ort_android/10b_19x19.onnx --node rconv1/w2 --out build/neuron_android/rconv1_w2.bin
          python - <<'PY'
          import pathlib,struct
          for node in ("w1","w2"):
              p=pathlib.Path("build/neuron_android/rconv1_"+node+".bin")
              magic,*v=struct.unpack("<8s12I",p.read_bytes()[:56])
              assert magic==b"K10CV001" and v==[19,19,128,128,3,3,1,1,1,1,19,19], (node,v)
              print("PASS real first residual Conv",node,"bytes",p.stat().st_size)
          PY
          python tools/export_katago_rconv1_block.py --model build/ort_android/10b_19x19.onnx --out build/neuron_android/katago_rconv1_full.bin
          python - <<'PY'
          import pathlib,struct
          p=pathlib.Path("build/neuron_android/katago_rconv1_full.bin")
          b=p.read_bytes()
          magic,h,w,c,k=struct.unpack("<8s4I",b[:24])
          size=24+2*(h*w*c+4*c+2*c*k*k*c)+4*h*w*c
          assert magic==b"K10RB001" and (h,w,c,k)==(19,19,128,3) and len(b)==size, (magic,h,w,c,k,len(b),size)
          print("PASS real KataGo full rconv1 residual packet",len(b))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-onnx-bench-arm64
          path: |
            build/ort_android/onnx_bench_android
            build/neuron_android/neuron_smoke_android
            build/neuron_android/neuron_conv_android
            build/neuron_android/neuron_conv_fp16_android
            build/neuron_android/neuron_katago_first_conv_android
            build/neuron_android/katago_first_conv.bin
            build/neuron_android/rconv1_w1.bin
            build/neuron_android/rconv1_w2.bin
            build/neuron_android/neuron_residual_add_android
            build/neuron_android/neuron_katago_rconv1_android
            build/neuron_android/katago_rconv1_full.bin
          if-no-files-found: ignore
